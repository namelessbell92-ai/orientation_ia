name: Keep Alive Render API

on:
  schedule:
    # Pings every 10 minutes so Render never sleeps
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -f -s https://orientation-ia-w93q.onrender.com/api/health || echo "Ping attempted"
